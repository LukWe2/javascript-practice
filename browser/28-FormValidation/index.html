<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Form Validation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Profil erstellen</h1>

    <form id="profileForm">

        <input
            id="nameInput"
            type="text"
            placeholder="Name"
        >

        <input
            id="ageInput"
            type="number"
            placeholder="Alter"
        >

        <button type="submit">
            Profil erstellen
        </button>

    </form>

    <p id="errorMessage"></p>

    <p id="output"></p>

    <script src="script.js"></script>

</body>
</html>
