<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine ToDo Website</title>

    <link rel="stylesheet" href="style.css">


</head>
<body>
    
    <h1>Meine To-Dos</h1>

    <main class="mainContent">
        <section>
            <h2>Meine Aufgaben</h2>
            <ul id="list">

            </ul>
            <p id="emptyMessage">Füge Items hinzu...</p>
        </section>


        <form id="todoForm" class="inputArea">
            <input id="input">
            <button id="addButton" type="submit">Hinzufügen</button>
        </form>

        <section class="printArea">
            <button id="printButton">Drucken</button>
        </section>
    </main>

    
    <script src="script.js"></script>
</body>
</html>
