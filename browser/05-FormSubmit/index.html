<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Form Submit</title>
</head>

<body>

    <h1>Profil erstellen</h1>

    <form id="profileForm">

        <input
            id="nameInput"
            type="text"
            placeholder="Name"
        >

        <input
            id="ageInput"
            type="number"
            placeholder="Alter"
        >

        <button type="submit">Profil anzeigen</button>

    </form>

    <p id="output">Noch kein Profil erstellt.</p>

    <script src="script.js"></script>

</body>
</html>
