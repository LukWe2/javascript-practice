<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>POST Request</title>
</head>

<body>

    <h1>Neuen Beitrag erstellen</h1>

    <form id="postForm">

        <input
            id="titleInput"
            type="text"
            placeholder="Titel"
        >

        <input
            id="bodyInput"
            type="text"
            placeholder="Text"
        >

        <button type="submit">
            Beitrag erstellen
        </button>

    </form>

    <p id="status">
        Noch kein Beitrag erstellt.
    </p>

    <script type="module" src="main.js"></script>

</body>
</html>
